<!DOCTYPE html>
<!--
W4SP_REFRESH_INSTRUCTIONS

When asked to refresh this file:
1. UPDATE existing bills — check each bill's current status on congress.gov and govtrack.us.
   Update: stage, stageDates, stageNote, desc, decisions, supporters, blockers, window, urgency, policyBias.
   DO NOT change: id, amend, issues (unless wrong), level.

2. SEARCH for new bills to ADD — never delete a bill, only update or append.
   Search sources: congress.gov (119th Congress browse), govtrack.us/congress/bills, ACLU scorecard,
   EFF action alerts, Democracy Docket, govinfo.gov. Look for:
   - Bills introduced in 2025 or later that are open to citizen action
   - Bills that have received a committee vote, floor vote, or new co-sponsors since last refresh
   - Legal challenges to enacted laws where the outcome is still open
   New bills get the next available ID (current max + 1).

3. NEVER DELETE a bill. If a bill died, change urgency to "stalled" and update stageNote to explain.

4. After refreshing, update the page title/subtitle date and save as:
   Fedtracker_DD_Mon_YY.html  (e.g. Fedtracker_30_May_26.html)

5. SOURCE each bill on congress.gov — update SOURCE_URLS if a bill number is corrected.
-->

const OFFICE_META = {

  "house":     {"label":"House Floor","dotCls":"od-hou"},
  "us-senate": {"label":"U.S. Senate","dotCls":"od-uss"},

};
const SOURCE_URLS = {
  1:  "https://www.congress.gov/bill/119th-congress/senate-bill/4082",
  2:  "https://www.congress.gov/bill/119th-congress/senate-bill/4082",
  3:  "https://www.congress.gov/bill/119th-congress/house-bill/4842",
  4:  "https://www.congress.gov/bill/119th-congress/senate-bill/4142",

};

/* ── Watch / Archive state (localStorage) ── */
var watchedIds  = new Set(JSON.parse(localStorage.getItem('fedtracker_watched')  || '[]'));
var archivedIds = new Set(JSON.parse(localStorage.getItem('fedtracker_archived') || '[]'));
function saveState(){
  localStorage.setItem('fedtracker_watched',  JSON.stringify([...watchedIds]));
  localStorage.setItem('fedtracker_archived', JSON.stringify([...archivedIds]));
}
function toggleWatch(id){
  if(watchedIds.has(id)){ watchedIds.delete(id); }
  else { watchedIds.add(id); archivedIds.delete(id); }
  saveState(); render();
}
function toggleArchive(id){
  if(archivedIds.has(id)){ archivedIds.delete(id); }
  else { archivedIds.add(id); watchedIds.delete(id); }
  saveState(); render();
}

const bills = [

const active = {timing:'all',impact:'all',issue:'all',policy:'all',office:'all',status:'active',search:''};

function policyBarStyle(b){
  if(b>=38&&b<=62)return'background:#6600CC';
  return'background:linear-gradient(to right,var(--bar-lib) '+b+'%,var(--bar-con) '+b+'%)';
}
function policyCategory(b){
  if(b>=63)return'liberal';
  if(b<=37)return'conservative';
  return'center';
}
function renderPipeline(bill){
  var stages=FEDERAL_STAGES;
  var isStalled=bill.urgency==='stalled';
  var dates=bill.stageDates||[];
  var dots=stages.map(function(label,i){
    var cls='pipe-step';
    if(i<bill.stage)cls+=' done';
    if(i===bill.stage&&!isStalled)cls+=' curr';
    if(i===bill.stage&&isStalled)cls+=' stalled';
    var dateHtml=dates[i]?'<div class="pipe-date">'+dates[i]+'</div>':'';
    return'<div class="'+cls+'"><div class="pipe-dot"></div><div class="pipe-label">'+label+dateHtml+'</div></div>';
  }).join('');
  return'<div class="pipeline-section"><div class="pipeline-head">Legislative path</div><div class="pipeline">'+dots+'</div><div class="stage-note">'+bill.stageNote+'</div></div>';
}
function matches(b){
  var isWatched=watchedIds.has(b.id);
  var isArchived=archivedIds.has(b.id);
  // Status filter — archived items are hidden unless status='archived' or status='all'
  if(active.status==='active'&&isArchived)return false;
  if(active.status==='watched'&&(!isWatched||isArchived))return false;
  if(active.status==='archived'&&!isArchived)return false;
  // active.status==='all' shows everything
  // Search
  if(active.search){
    var q=active.search.toLowerCase();
    var hay=(b.name+' '+b.desc+' '+b.issues.join(' ')).toLowerCase();
    if(hay.indexOf(q)===-1)return false;
  }
  var timingVal=active.timing==='session'?'year':active.timing;
  if(active.timing!=='all'&&b.urgency!==timingVal)return false;
  if(active.impact!=='all'){
    var f=active.impact;
    if(f==='4th'&&b.amend.indexOf('4th')===-1)return false;
    if(f==='1st'&&b.amend.indexOf('1st')===-1)return false;
    if(f==='due'&&b.amend.indexOf('due')===-1&&b.amend.indexOf('14th')===-1)return false;
  }
  if(active.issue!=='all'&&b.issues.indexOf(active.issue)===-1)return false;
  if(active.policy!=='all'&&policyCategory(b.policyBias)!==active.policy)return false;
  if(active.office!=='all'&&b.ratifyOffice!==active.office)return false;
  return true;
}
async function copyCard(id,btn){
  var b=bills.find(function(x){return x.id===id;});
  if(!b)return;
  var divider='—'.repeat(55);
  var offMeta=OFFICE_META[b.ratifyOffice]||{label:b.ratifyOffice};
  var lines=[b.name,divider,b.desc,'','LEGISLATIVE STATUS',b.stageNote,'','PUBLIC INFLUENCE WINDOW',b.window,'','INTRODUCED BY',b.introduced,'','KEY SUPPORTERS',b.supporters,'','KEY BLOCKERS',b.blockers,'','WHAT IS BEING DECIDED']
    .concat(b.decisions.map(function(d){return'  → '+d.label+' — '+d.text;}))
    .concat(['',divider,'Timing: '+b.urgency+' | Currently with: '+offMeta.label]);
  try{
    await navigator.clipboard.writeText(lines.join('\n'));
    btn.classList.add('copied');btn.title='Copied!';
    setTimeout(function(){btn.classList.remove('copied');btn.title='Copy card to clipboard';},1400);
  }catch(e){btn.title='Copy failed';}
}

var container=document.getElementById('bills');
var countEl=document.getElementById('count');
var watchedBanner=document.getElementById('watchedBanner');

function render(){
  // Update watched-banner
  var wc=watchedIds.size;
  if(wc>0&&active.status!=='watched'){
    watchedBanner.textContent='● '+wc+' bill'+(wc===1?'':'s')+' on your watch list — click "Watched" above to view';
    watchedBanner.classList.add('visible');
  } else {
    watchedBanner.classList.remove('visible');
  }

  var filtered=bills.filter(matches);
  var shown=filtered.length;
  var label=active.status==='archived'?'archived item':'item';
  countEl.textContent=shown+' '+label+(shown!==1?'s':'')+' shown';

  if(!shown){
    container.innerHTML='<div class="empty">No bills match these filters.</div>';
    return;
  }

  container.innerHTML=filtered.map(function(b){
    var isWatched=watchedIds.has(b.id);
    var isArchived=archivedIds.has(b.id);
    var urgTag=b.urgency==='urgent'
      ?'<span class="tag tag-now">Act now</span>'
      :b.urgency==='months'
        ?'<span class="tag tag-months">Months</span>'
        :b.urgency==='stalled'
          ?'<span class="tag tag-stalled">Stalled</span>'
          :'<span class="tag tag-year">Session</span>';
    var statusTag=isWatched
      ?'<span class="tag tag-watch">● Watching</span>'
      :isArchived
        ?'<span class="tag tag-archive">● Archived</span>'
        :'';
    var amendBadges=b.amend.map(function(a){return'<span class="amend-tag">'+a+'</span>';}).join('');
    var decisionsHtml=b.decisions.map(function(d){
      return'<div class="decision-item"><span class="decision-label">'+d.label+'</span> — '+d.text+'</div>';
    }).join('');
    var offMeta=OFFICE_META[b.ratifyOffice]||{label:b.ratifyOffice,dotCls:'od-com'};
    var watchBtnCls='status-toggle'+(isWatched?' watch-active':'');
    var archiveBtnCls='status-toggle'+(isArchived?' archive-active':'');
    var watchLabel=isWatched?'● Watching':'Watch';
    var archiveLabel=isArchived?'● Archived':'Archive';
    var srcHtml=SOURCE_URLS[b.id]
      ?'<div class="source-link"><a href="'+SOURCE_URLS[b.id]+'" target="_blank" rel="noopener noreferrer">Official source ↗</a></div>'
      :'';
    return'<div class="bill">'
      +'<div class="policy-bar" style="'+policyBarStyle(b.policyBias)+'"><span class="policy-bar-label">Policy direction</span></div>'
      +'<div class="card-top-tags">'+urgTag+statusTag+'</div>'
      +'<button class="copy-btn" onclick="copyCard('+b.id+',this)" title="Copy card to clipboard">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>'
      +'</button>'
      +'<div class="bill-name">'+b.name+amendBadges+'</div>'
      +'<div class="bill-desc">'+b.desc+'</div>'
      +renderPipeline(b)
      +'<div class="meta-grid">'
        +'<div><div class="lbl">Public influence window</div><div class="val">'+b.window+'</div></div>'
        +'<div><div class="lbl">Introduced by</div><div class="val">'+b.introduced+'</div></div>'
        +'<div><div class="lbl">Key supporters</div><div class="val">'+b.supporters+'</div></div>'
        +'<div class="full-width"><div class="lbl">Key blockers</div><div class="val">'+b.blockers+'</div></div>'
      +'</div>'
      +'<div class="deciding-divider"><span>What is being decided</span></div>'
      +'<div class="decisions">'+decisionsHtml+'</div>'
      +'<div class="card-footer">'
        +'<div class="office-badge"><div class="office-dot '+offMeta.dotCls+'"></div>'+offMeta.label+'</div>'
        +'<div class="card-actions">'
          +'<button class="'+watchBtnCls+'" onclick="toggleWatch('+b.id+')"><span class="s-dot"></span>'+watchLabel+'</button>'
          +'<button class="'+archiveBtnCls+'" onclick="toggleArchive('+b.id+')"><span class="s-dot"></span>'+archiveLabel+'</button>'
          +srcHtml
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('input',function(){
  active.search=this.value.trim();
  render();
});
document.getElementById('filterGroups').addEventListener('click',function(e){
  var chip=e.target.closest('[data-group]');
  if(!chip)return;
  var group=chip.dataset.group;
  var val=chip.dataset.f;
  active[group]=val;
  document.querySelectorAll('[data-group="'+group+'"]').forEach(function(c){
    c.classList.toggle('active',c.dataset.f===val);
  });
  render();
});
render();
</script>
