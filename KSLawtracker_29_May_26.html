W4SP_REFRESH_INSTRUCTIONS

When asked to refresh this file, update the following fields for EVERY bill using
current information from official government sources (kslegislature.gov for Kansas bills,
congress.gov for federal bills, city/county sites for local ordinances) and
reliable news reporting. Cross-check all facts before writing them.

Fields to update on every bill:
  name         — current official bill number and short title
  stage        — current stage index (0-based integer; stage === stages.length means enacted/signed)
  stageDates   — array of date strings for each completed stage (military format: 14 Jan 25)
  stageNote    — one-sentence plain-English description of current status
  desc         — updated plain-language summary of what the bill does
  decisions    — updated list of {label, text} objects describing what is being decided
  supporters   — current named key supporters (sponsors, advocacy groups, officials)
  blockers     — current named key blockers (opponents, advocacy groups, officials)
  window       — updated public influence window (when and how citizens can still act)
  policyBias   — updated 0-100 integer (0 = most conservative, 100 = most liberal, 50 = center)

DO NOT change:
  id           — unique bill identifier (never reassign or renumber)
  level        — "federal" | "state" | "local"

After refreshing all bills, update the page title and subtitle date to today,
and save the file with today's date in the filename:

const active = {level:'all',timing:'all',impact:'all',issue:'all',policy:'all',office:'all',city:'all',search:''};
function policyBarStyle(b){if(b>=38&&b<=62)return'background:#6600CC';return'background:linear-gradient(to right,var(--bar-lib) '+b+'%,var(--bar-con) '+b+'%)';}
function policyCategory(b){if(b>=63)return'liberal';if(b<=37)return'conservative';return'center';}
function renderPipeline(bill){var stages=bill.level==='federal'?FEDERAL_STAGES:bill.level==='local'?LOCAL_STAGES:KANSAS_STAGES;var isStalled=bill.urgency==='stalled';var dates=bill.stageDates||[];var dots=stages.map(function(label,i){var cls='pipe-step';if(i<bill.stage)cls+=' done';if(i===bill.stage&&!isStalled)cls+=' curr';if(i===bill.stage&&isStalled)cls+=' stalled';var dateHtml=dates[i]?'<div class="pipe-date">'+dates[i]+'</div>':'';return'<div class="'+cls+'"><div class="pipe-dot"></div><div class="pipe-label">'+label+dateHtml+'</div></div>';}).join('');return'<div class="pipeline-section"><div class="pipeline-head">Legislative path</div><div class="pipeline">'+dots+'</div><div class="stage-note">'+bill.stageNote+'</div></div>';}
function matches(b){if(active.search){var q=active.search.toLowerCase();var hay=(b.name+' '+b.desc+' '+(b.municipality||'')).toLowerCase();if(hay.indexOf(q)===-1)return false;}if(active.level!=='all'&&b.level!==active.level)return false;if(active.city!=='all'&&b.level==='local'&&b.municipality!==active.city)return false;var timingVal=active.timing==='session'?'year':active.timing;if(active.timing!=='all'&&b.urgency!==timingVal)return false;if(active.impact!=='all'){var f=active.impact;if(f==='4th'&&b.amend.indexOf('4th')===-1)return false;if(f==='1st'&&b.amend.indexOf('1st')===-1)return false;if(f==='due'&&b.amend.indexOf('due')===-1&&b.amend.indexOf('14th')===-1)return false;}if(active.issue!=='all'&&b.issues.indexOf(active.issue)===-1)return false;if(active.policy!=='all'&&policyCategory(b.policyBias)!==active.policy)return false;if(active.office!=='all'&&b.ratifyOffice!==active.office)return false;return true;}
async function copyCard(id,btn){var b=bills.find(function(x){return x.id===id;});if(!b)return;var divider='—'.repeat(55);var offMeta=OFFICE_META[b.ratifyOffice]||{label:b.ratifyOffice};var lines=[b.name,divider,b.desc,'','LEGISLATIVE STATUS',b.stageNote,'','PUBLIC INFLUENCE WINDOW',b.window,'','INTRODUCED BY',b.introduced,'','KEY SUPPORTERS',b.supporters,'','KEY BLOCKERS',b.blockers,'','WHAT IS BEING DECIDED'].concat(b.decisions.map(function(d){return'  → '+d.label+' — '+d.text;})).concat(['',divider,'Level: '+b.level+(b.municipality?' ('+b.municipality+')':'')+'  | Timing: '+b.urgency+' | Currently with: '+offMeta.label]);try{await navigator.clipboard.writeText(lines.join('\n'));btn.classList.add('copied');btn.title='Copied!';setTimeout(function(){btn.classList.remove('copied');btn.title='Copy card to clipboard';},1400);}catch(e){btn.title='Copy failed';}}
var container=document.getElementById('bills');var countEl=document.getElementById('count');
function render(){var filtered=bills.filter(matches);countEl.textContent=filtered.length+' item'+(filtered.length!==1?'s':'')+' shown';if(!filtered.length){container.innerHTML='<div class="empty">No bills match these filters.</div>';return;}container.innerHTML=filtered.map(function(b){var lvlTag=b.level==='federal'?'<span class="tag tag-fed">🇺🇸 Federal</span>':b.level==='local'?'<span class="tag tag-local">📍 '+b.municipality+'</span>':'<span class="tag tag-ks">Kansas</span>';var urgTag=b.urgency==='urgent'?'<span class="tag tag-now">Act now</span>':b.urgency==='months'?'<span class="tag tag-months">Months</span>':b.urgency==='stalled'?'<span class="tag tag-stalled">Stalled</span>':'<span class="tag tag-year">Session</span>';var amendBadges=b.amend.map(function(a){return'<span class="amend-tag">'+a+'</span>';}).join('');var decisionsHtml=b.decisions.map(function(d){return'<div class="decision-item"><span class="decision-label">'+d.label+'</span> — '+d.text+'</div>';}).join('');var offMeta=OFFICE_META[b.ratifyOffice]||{label:b.ratifyOffice,dotCls:'od-com'};return'<div class="bill"><div class="policy-bar" style="'+policyBarStyle(b.policyBias)+'"><span class="policy-bar-label">Policy direction</span></div><div class="card-top-tags">'+lvlTag+urgTag+'</div><button class="copy-btn" onclick="copyCard('+b.id+',this)" title="Copy card to clipboard"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button><div class="bill-name">'+b.name+amendBadges+'</div><div class="bill-desc">'+b.desc+'</div>'+renderPipeline(b)+'<div class="meta-grid"><div><div class="lbl">Public influence window</div><div class="val">'+b.window+'</div></div><div><div class="lbl">Introduced by</div><div class="val">'+b.introduced+'</div></div><div><div class="lbl">Key supporters</div><div class="val">'+b.supporters+'</div></div><div class="full-width"><div class="lbl">Key blockers</div><div class="val">'+b.blockers+'</div></div></div><div class="deciding-divider"><span>What is being decided</span></div><div class="decisions">'+decisionsHtml+'</div><div class="office-badge"><div class="office-dot '+offMeta.dotCls+'"></div>'+offMeta.label+'</div>'+(SOURCE_URLS[b.id]?'<div class="source-link"><a href="'+SOURCE_URLS[b.id]+'" target="_blank" rel="noopener noreferrer">Official source ↗</a></div>':'')+'</div>';}).join('');}
document.getElementById('searchInput').addEventListener('input',function(){active.search=this.value.trim();render();});
document.getElementById('filterGroups').addEventListener('click',function(e){var chip=e.target.closest('[data-group]');if(!chip)return;var group=chip.dataset.group;var val=chip.dataset.f;active[group]=val;document.querySelectorAll('[data-group="'+group+'"]').forEach(function(c){c.classList.toggle('active',c.dataset.f===val);});render();});
render();
